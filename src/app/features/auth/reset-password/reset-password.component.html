<form class="space-y-4" [formGroup]="form" (ngSubmit)="onSubmit()">
  <h2 class="text-lg font-semibold">Новый пароль</h2>
  <p class="text-sm text-stone-600">Введите код из письма и задайте новый пароль.</p>

  <tui-textfield>
    <label tuiLabel>Код подтверждения</label>
    <input
      tuiInput
      formControlName="code"
      type="text"
      inputmode="numeric"
      maxlength="8"
      placeholder="12345678"
      [invalid]="form.controls.code.invalid && form.controls.code.touched"
      [tuiTextfieldCleaner]="true"
    />
  </tui-textfield>
  <tui-error
    [error]="
      form.controls.code.touched && form.controls.code.hasError('required')
        ? 'Введите код подтверждения'
        : form.controls.code.touched && form.controls.code.hasError('pattern')
          ? 'Код должен состоять из 8 цифр'
          : null
    "
  ></tui-error>

  <tui-textfield>
    <label tuiLabel>Новый пароль</label>
    <input
      tuiInput
      formControlName="newPassword"
      type="password"
      placeholder="********"
      [invalid]="form.controls.newPassword.invalid && form.controls.newPassword.touched"
    />
    <tui-icon tuiPassword></tui-icon>
  </tui-textfield>
  <tui-error
    [error]="
      form.controls.newPassword.touched && form.controls.newPassword.hasError('required')
        ? 'Введите новый пароль'
        : form.controls.newPassword.touched && form.controls.newPassword.hasError('minlength')
          ? 'Пароль должен содержать минимум 8 символов'
          : null
    "
  ></tui-error>

  <tui-textfield>
    <label tuiLabel>Повторите пароль</label>
    <input
      tuiInput
      formControlName="repeatPassword"
      type="password"
      placeholder="********"
      [invalid]="form.controls.repeatPassword.invalid && form.controls.repeatPassword.touched"
    />
    <tui-icon tuiPassword></tui-icon>
  </tui-textfield>
  <tui-error
    [error]="
      form.controls.repeatPassword.touched && form.controls.repeatPassword.hasError('required')
        ? 'Повторите пароль'
        : null
    "
  ></tui-error>

  <button
    tuiButton
    appearance="primary"
    size="m"
    type="submit"
    class="w-full mt-2"
    [disabled]="form.invalid || loading"
  >
    {{ loading ? 'Сохраняем' : 'Сохранить пароль' }}
  </button>

  @if (success) {
    <p class="text-sm text-green-700 text-center">Пароль изменен. Перенаправляем на вход...</p>
  }

  <tui-error [error]="error || null"></tui-error>

  <p class="text-sm text-stone-500 text-center">
    Нет кода?
    <a routerLink="/auth/forgot-password" tuiLink class="text-accent-800">Запросить снова</a>
  </p>
</form>
