<section class="fridge-shell space-y-5 mt-4">
  <div class="flex items-center justify-between">
    <div>
      <p class="text-xs uppercase tracking-wide text-sky-300">🧊 fresh keeper</p>
      <h1 class="text-2xl font-semibold text-white">Мой холодильник</h1>
      <p class="text-sm text-sky-100/90">Следите за запасами и сроками годности.</p>
    </div>
  </div>

  <div tuiCardLarge class="frost-panel space-y-4">
    <div class="grid gap-3 sm:grid-cols-2">
      <label class="field">
        <span>Ингредиент</span>
        <app-ingredient-autocomplete
          variant="dark"
          placeholder="Поиск ингредиентов..."
          (selected)="onIngredientSelected($event)"
        />
      </label>

      <label class="field">
        <span>Количество</span>
        <tui-textfield>
          <input
            tuiInput
            class="input"
            type="number"
            min="0"
            step="0.1"
            [(ngModel)]="form.quantity"
          />
        </tui-textfield>
      </label>

      <label class="field">
        <span>Ед. измерения</span>
        <tui-textfield>
          <select
            tuiSelect
            class="input"
            [(ngModel)]="form.unitId"
            [items]="unitIds"
            [labels]="unitLabels"
            placeholder="Не выбрано"
          ></select>
        </tui-textfield>
      </label>

      <label class="field">
        <span>Срок годности (опционально)</span>
        <tui-textfield>
          <input tuiInput class="input" type="date" [(ngModel)]="form.expiresAt" />
        </tui-textfield>
      </label>
    </div>
    <tui-error *ngIf="error" [error]="error"></tui-error>
    <button tuiButton appearance="primary" size="m" class="w-full" (click)="add()">Добавить</button>
  </div>

  <div tuiCardLarge class="frost-panel space-y-3" *ngIf="items.length; else empty">
    <div class="space-y-2">
      <div
        *ngFor="let item of items"
        class="flex items-center justify-between border-b border-white/10 pb-2 last:border-none last:pb-0"
      >
        <div class="leading-tight text-white">
          <p class="font-semibold">{{ item.ingredientName }}</p>
          <p class="text-xs text-sky-100/80">{{ item.quantity || 0 }} {{ item.unitName || '' }}</p>
          <p class="text-xs text-sky-100/60" *ngIf="item.expiresAt">
            Годен до {{ item.expiresAt | date }}
          </p>
        </div>
        <button
          tuiButton
          appearance="secondary-destructive"
          size="s"
          (click)="remove(item.ingredientId)"
        >
          Удалить
        </button>
      </div>
    </div>
  </div>
  <ng-template #empty>
    <div class="frost-panel text-sm text-sky-100/80 text-center">
      Список пуст. Добавьте продукты, чтобы получить рекомендации.
    </div>
  </ng-template>
</section>
