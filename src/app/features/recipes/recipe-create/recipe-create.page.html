<section class="space-y-4">
  <div>
    <h1 class="text-2xl font-semibold">Создать рецепт</h1>
    <p class="text-sm text-stone-500">Поделитесь любимым блюдом с сообществом.</p>
  </div>
  <form class="space-y-4 recipe-form" [formGroup]="form" (ngSubmit)="submit()">
    <div class="grid gap-3 sm:grid-cols-2 form-grid">
      <label class="space-y-1 text-sm text-stone-700">
        <span>Название</span>
        <tui-textfield>
          <input tuiInput class="w-full" formControlName="title" />
        </tui-textfield>
      </label>
      <label class="space-y-1 text-sm text-stone-700">
        <span>Категория</span>
        <tui-textfield tuiChevron [stringify]="stringifyCategory">
          <input tuiSelect class="w-full" formControlName="categoryId" placeholder="Не выбрано" />
          <tui-data-list-wrapper *tuiDropdown [items]="categoryIds"></tui-data-list-wrapper>
        </tui-textfield>
      </label>
      <label class="space-y-1 text-sm text-stone-700 sm:col-span-2">
        <span>Описание</span>
        <tui-textfield>
          <textarea tuiTextarea class="w-full" rows="2" formControlName="description"></textarea>
        </tui-textfield>
      </label>
      <label class="space-y-1 text-sm text-stone-700 sm:col-span-2">
        <span>Инструкции</span>
        <tui-textfield>
          <textarea tuiTextarea class="w-full" rows="4" formControlName="instructions"></textarea>
        </tui-textfield>
      </label>
      <label class="space-y-1 text-sm text-stone-700">
        <span>Время подготовки (мин)</span>
        <tui-textfield>
          <input tuiInput type="number" class="w-full" formControlName="preparationTime" />
        </tui-textfield>
      </label>
      <label class="space-y-1 text-sm text-stone-700">
        <span>Время готовки (мин)</span>
        <tui-textfield>
          <input tuiInput type="number" class="w-full" formControlName="cookingTime" />
        </tui-textfield>
      </label>
      <label class="space-y-1 text-sm text-stone-700">
        <span>Порции</span>
        <tui-textfield>
          <input tuiInput type="number" class="w-full" formControlName="servings" />
        </tui-textfield>
      </label>
      <label class="space-y-1 text-sm text-stone-700">
        <span>Сложность (1-5)</span>
        <tui-textfield>
          <input
            tuiInput
            type="number"
            min="1"
            max="5"
            class="w-full"
            formControlName="difficultyLevel"
          />
        </tui-textfield>
      </label>
    </div>

    <div class="space-y-2">
      <div class="flex items-center justify-between">
        <p class="text-sm font-semibold text-stone-800">Ингредиенты</p>
        <button tuiButton appearance="flat" size="s" type="button" (click)="addIngredient()">
          Добавить
        </button>
      </div>
      <div class="space-y-3" formArrayName="ingredients">
        <div
          *ngFor="let group of ingredientsArray.controls; let i = index"
          [formGroupName]="i"
          tuiCardLarge
          class="ingredient-row grid gap-2 sm:grid-cols-4 shadow-sm"
        >
          <label class="space-y-1 text-sm text-stone-700 sm:col-span-1">
            <app-ingredient-autocomplete
              placeholder="Ингредиент..."
              (selected)="onIngredientSelectedInForm($event, i)"
            />
          </label>
          <tui-textfield>
            <input
              tuiInput
              type="number"
              min="0"
              step="0.1"
              class="w-full"
              formControlName="quantity"
              placeholder="Количество"
            />
          </tui-textfield>
          <tui-textfield tuiChevron [stringify]="stringifyUnit">
            <input tuiSelect class="w-full" formControlName="unitId" placeholder="Ед." />
            <tui-data-list-wrapper *tuiDropdown [items]="unitIds"></tui-data-list-wrapper>
          </tui-textfield>
          <div class="flex items-center gap-2">
            <tui-textfield class="w-full">
              <input tuiInput class="w-full" formControlName="notes" placeholder="Примечание" />
            </tui-textfield>
            <button
              tuiButton
              appearance="secondary-destructive"
              size="s"
              type="button"
              (click)="removeIngredient(i)"
            >
              ✕
            </button>
          </div>
        </div>
      </div>
    </div>

    <tui-error *ngIf="error" [error]="error"></tui-error>
    <button
      tuiButton
      appearance="primary"
      size="m"
      type="submit"
      class="w-full sm:w-auto"
      [disabled]="form.invalid || loading"
    >
      {{ loading ? 'Сохраняем...' : 'Сохранить рецепт' }}
    </button>
  </form>
</section>
