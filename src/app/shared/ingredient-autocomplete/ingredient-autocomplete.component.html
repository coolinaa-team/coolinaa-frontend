<div class="relative">
  <tui-textfield [tuiTextfieldCleaner]="true">
    <input
      tuiInput
      type="text"
      [(ngModel)]="searchText"
      (ngModelChange)="onSearch($event)"
      (focus)="showDropdown = true"
      (blur)="onBlur()"
      [class.input-light]="variant === 'light'"
      [class.input-dark]="variant === 'dark'"
      [placeholder]="placeholder"
    />
  </tui-textfield>

  @if (shouldShowDropdown) {
    <div [class.dropdown-light]="variant === 'light'" [class.dropdown-dark]="variant === 'dark'">
      @if (loading) {
        <div class="dropdown-loading flex items-center gap-2">
          <tui-loader [overlay]="false" size="s"></tui-loader>
          <span>Загрузка</span>
        </div>
      } @else if (filteredIngredients.length > 0) {
        @for (item of filteredIngredients; track item.id) {
          <button
            type="button"
            tuiButton
            appearance="flat"
            size="s"
            (click)="selectItem(item)"
            [class.dropdown-item-light]="variant === 'light'"
            [class.dropdown-item-dark]="variant === 'dark'"
          >
            {{ item.name }}
            @if (item.categoryName) {
              <span class="ml-2 opacity-60">• {{ item.categoryName }}</span>
            }
          </button>
        }
      } @else {
        <div class="dropdown-empty">Ингредиенты не найдены</div>
      }
    </div>
  }
</div>
