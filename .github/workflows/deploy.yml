name: Deploy to server

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          script: |
            set -e
            echo "git pull origin main"
            cd /home/coolinaa-smart-recipes/client
            git pull origin main

            echo "Установка зависимостей"
            npm ci

            echo "Сборка проекта"
            npm run build

            echo "Инъекция ключей мониторинга и конфигурация"
            export SENTRY_DSN='${{ secrets.SENTRY_DSN }}'
            export POSTHOG_KEY='${{ secrets.POSTHOG_KEY }}'
            export ENVIRONMENT='production'

            if [ -f scripts/inject-monitoring.js ]; then
              node scripts/inject-monitoring.js dist/client/browser
            else
              echo "scripts/inject-monitoring.js не найден — убедитесь, что он в репо"
            fi

            echo "Успех!"
